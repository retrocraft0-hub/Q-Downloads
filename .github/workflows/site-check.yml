name: Q Downloads site checks
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "index.html"
      - "site.js"
      - "i18n.js"
      - "site.css"
      - "pages.js"
      - "about.html"
      - "history.html"
      - "qbot.html"
      - "catalog/**"
      - "tools/check-release-catalog.py"
      - "tools/test-release-catalog-filenames.py"
      - "tools/test-release-catalog-duplicate-keys.py"
      - "tools/test-release-catalog-dates.py"
      - "tools/test-catalog-page-contract.py"
      - "tests/download-page.test.cjs"
      - "tests/catalog-cross-shard.test.cjs"
      - "assets/**"
      - ".github/workflows/site-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify JavaScript parses
        run: |
          node --check site.js
          node --check pages.js
          node --check i18n.js
      - name: Run download-page regression tests when present
        shell: bash
        run: |
          if [[ -f tests/download-page.test.cjs ]]; then
            node --test tests/download-page.test.cjs
          else
            echo "No download-page regression test on this branch; skipping."
          fi
          if [[ -f tests/catalog-cross-shard.test.cjs ]]; then
            node --test tests/catalog-cross-shard.test.cjs
          fi
      - name: Verify public catalog uniqueness, exact release links and status
        run: python3 tools/check-release-catalog.py
      - name: Reject mismatched public JAR filename identities
        run: python3 tools/test-release-catalog-filenames.py
      - name: Reject duplicate JSON object keys at every catalog depth
        run: python3 tools/test-release-catalog-duplicate-keys.py
      - name: Reject invalid published calendar dates
        run: python3 tools/test-release-catalog-dates.py
      - name: Reject browser-incompatible catalog pagination
        run: python3 tools/test-catalog-page-contract.py
      - name: Verify HTML pages and real release catalogue
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          for name in ('index.html','about.html','history.html','qbot.html'):
              body=Path(name).read_text()
              assert '<!doctype html>' in body.lower(),name
              assert 'site.css' in body and 'id="locale"' in body,name
          index=Path('index.html').read_text()
          assert 'dateFrom' not in index and 'dateTo' not in index
          assert len(re.findall('class="product-card ',index))==5
          assert 'id="freeSearch"' in index and 'id="searchResults"' in index
          script=Path('site.js').read_text()
          assert 'function renderSearch()' in script
          import xml.etree.ElementTree as ET
          for product in ('system','core','entity','chunky','player'):
              img=Path('assets')/('thumb-'+product+'.svg')
              assert img.exists() and img.stat().st_size>500,product
              ET.parse(img)
              assert 'assets/thumb-'+product+'.svg' in index,product
          manifest=json.loads(Path('catalog/manifest.json').read_text())
          assert manifest['schema']==1 and manifest['repo']=='retrocraft0-hub/Q-Downloads'
          entries=[]
          for page in manifest['pages']:
              shard=json.loads(Path(page['path']).read_text())
              assert len(shard['entries'])==page['count']
              entries += shard['entries']
          assert len(entries)==manifest['count']
          allowed={'Q-System','Q-Core','Q-Entity','Q-Chunky','Q-Player'}
          for item in entries:
              assert item['product'] in allowed and item['filename'].endswith('.jar')
              assert item['href'].startswith('https://github.com/retrocraft0-hub/Q-Downloads/releases/download/')
              assert item['releaseUrl'].startswith('https://github.com/retrocraft0-hub/Q-Downloads/releases/tag/')
          print(f'Q site checks passed; {len(entries)} genuine release entries')
          PY
